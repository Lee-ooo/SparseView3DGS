# SparseView3DGS 统一配置
project_name: personal_scene
colmap_executable: colmap
camera_model: OPENCV
single_camera: true
matching_method: exhaustive

# SfM 只提供相机位姿/内参；PDCNet+ 负责替换 3DGS 的点云初始化
pdcnet_enabled: true
pdcnet_root: train/sfm/dense_matcher
pdcnet_pretrained_model: megadepth
pdcnet_views: 3
pdcnet_multi_stage_type: h

# 训练阶段
view_consistency: true
epipolar_depth_prior: false
depth_model: none
few_shot_regularization: true

# 少视图质量门槛
min_image_width: 640
min_image_height: 480
blur_threshold: 60.0
min_registered_images: 4
